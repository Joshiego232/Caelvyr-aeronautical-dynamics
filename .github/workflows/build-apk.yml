name: Build and Publish Caelvyr Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate and extract Android project
        shell: bash
        run: |
          if [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f Caelvyr_Android_Project.zip ]; then
            unzip -oq Caelvyr_Android_Project.zip
            echo "PROJECT_DIR=Caelvyr_Android_Project" >> "$GITHUB_ENV"
          elif [ -d Caelvyr_Android_Project ] && [ -f Caelvyr_Android_Project/settings.gradle ]; then
            echo "PROJECT_DIR=Caelvyr_Android_Project" >> "$GITHUB_ENV"
          else
            echo "Cannot find Android project. Upload Caelvyr_Android_Project.zip to the repository root." >&2
            exit 1
          fi

      - name: Apply Caelvyr 1.1.0 flight-deck and scenery updates; package source
        shell: bash
        run: |
          python3 tools/patch_caelvyr.py "$PROJECT_DIR"
          python3 tools/patch_caelvyr_110.py "$PROJECT_DIR"
          if [ -f Changelog.md ]; then cp Changelog.md "$PROJECT_DIR/CHANGELOG.md"; fi
          mkdir -p "$PROJECT_DIR/publish"
          rm -f /tmp/Caelvyr_Android_Project-patched.zip
          if [ "$PROJECT_DIR" = "." ]; then
            zip -qr /tmp/Caelvyr_Android_Project-patched.zip app settings.gradle build.gradle gradle.properties CHANGELOG.md README.md -x 'app/build/*' 'app/*.p12' 'publish/*'
          else
            (cd "$(dirname "$PROJECT_DIR")" && zip -qr /tmp/Caelvyr_Android_Project-patched.zip "$(basename "$PROJECT_DIR")" -x "$PROJECT_DIR/app/build/*" "$PROJECT_DIR/publish/*" "$PROJECT_DIR/app/*.p12" "$PROJECT_DIR/.gradle/*")
          fi
          cp /tmp/Caelvyr_Android_Project-patched.zip "$PROJECT_DIR/publish/Caelvyr_Android_Project.zip"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check release signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CAELVYR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CAELVYR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CAELVYR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CAELVYR_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: Configure persistent release signing key
        if: ${{ steps.signing.outputs.configured == 'true' }}
        shell: bash
        env:
          CAELVYR_KEYSTORE_BASE64: ${{ secrets.CAELVYR_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$PROJECT_DIR/app"
          echo "$CAELVYR_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/app/caelvyr-release-key.p12"
          chmod 600 "$PROJECT_DIR/app/caelvyr-release-key.p12"

      - name: Build signed release APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        shell: bash
        env:
          CAELVYR_KEYSTORE_PASSWORD: ${{ secrets.CAELVYR_KEYSTORE_PASSWORD }}
          CAELVYR_KEY_ALIAS: ${{ secrets.CAELVYR_KEY_ALIAS }}
          CAELVYR_KEY_PASSWORD: ${{ secrets.CAELVYR_KEY_PASSWORD }}
        run: |
          export CAELVYR_KEYSTORE_PATH="$GITHUB_WORKSPACE/$PROJECT_DIR/app/caelvyr-release-key.p12"
          gradle --no-daemon -p "$PROJECT_DIR" assembleRelease
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" "$PROJECT_DIR/app/build.gradle" | head -n 1)
          if [ -z "$VERSION" ]; then echo "Could not read versionName from app/build.gradle" >&2; exit 1; fi
          mkdir -p "$PROJECT_DIR/publish"
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$PROJECT_DIR/publish/Caelvyr-Aeronautical-Dynamics.apk"
          echo "CAELVYR_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build debug APK until release signing is configured
        if: ${{ steps.signing.outputs.configured != 'true' }}
        shell: bash
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" "$PROJECT_DIR/app/build.gradle" | head -n 1)
          if [ -z "$VERSION" ]; then echo "Could not read versionName from app/build.gradle" >&2; exit 1; fi
          mkdir -p "$PROJECT_DIR/publish"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$PROJECT_DIR/publish/Caelvyr-Aeronautical-Dynamics-debug.apk"
          echo "CAELVYR_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare release notes
        if: ${{ steps.signing.outputs.configured == 'true' }}
        shell: bash
        run: |
          if [ -f Changelog.md ]; then
            cp Changelog.md "$PROJECT_DIR/publish/CHANGELOG.md"
          elif [ -f "$PROJECT_DIR/CHANGELOG.md" ]; then
            cp "$PROJECT_DIR/CHANGELOG.md" "$PROJECT_DIR/publish/CHANGELOG.md"
          else
            printf '# Caelvyr Aeronautical Dynamics — Release V%s\n\nSee the repository changelog for details.\n' "$CAELVYR_RELEASE_VERSION" > "$PROJECT_DIR/publish/CHANGELOG.md"
          fi

      - name: Publish versioned GitHub Release with APK and project ZIP
        if: ${{ steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v$CAELVYR_RELEASE_VERSION"
          NOTES="$PROJECT_DIR/publish/CHANGELOG.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Caelvyr release V$CAELVYR_RELEASE_VERSION" \
              --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Caelvyr release V$CAELVYR_RELEASE_VERSION" \
              --notes-file "$NOTES" --latest
          fi
          gh release upload "$TAG" "$PROJECT_DIR/publish/Caelvyr-Aeronautical-Dynamics.apk" --repo "$GITHUB_REPOSITORY" --clobber
          if [ -f "$PROJECT_DIR/publish/Caelvyr_Android_Project.zip" ]; then
            gh release upload "$TAG" "$PROJECT_DIR/publish/Caelvyr_Android_Project.zip" --repo "$GITHUB_REPOSITORY" --clobber
          fi

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caelvyr-Aeronautical-Dynamics-build-apk
          path: |
            ${{ env.PROJECT_DIR }}/publish/*.apk
            ${{ env.PROJECT_DIR }}/publish/Caelvyr_Android_Project.zip
          if-no-files-found: error
          retention-days: 14

      - name: Explain release status
        if: always()
        shell: bash
        run: |
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            echo "A signed release was built and published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A debug APK was built as an artifact. No GitHub Release was published because one or more release-signing secrets are missing. Add the four CAELVYR signing secrets in Settings → Secrets and variables → Actions, then run the workflow again to publish an update-enabled release." >> "$GITHUB_STEP_SUMMARY"
          fi
