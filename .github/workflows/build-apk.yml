
name: Build Caelvyr Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract updated Android project
        run: |
          if [ -f Caelvyr_Android_Project.zip ]; then
            unzip -oq Caelvyr_Android_Project.zip
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p Caelvyr_Android_Project assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caelvyr-Aeronautical-Dynamics-debug-apk
          path: Caelvyr_Android_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
